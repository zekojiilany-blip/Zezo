<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="description" content="ده موقع لمنصة تعلينية">
    <meta name="keywords" content="منصة, برمجة, تعلم">
    <meta name="author" content="❤️ZeZo🤍">
    <title>❤️ZeZo🤍</title>
    <style>
      body {
        font-family: 'Segoe UI', Tahoma, sans-serif;
        background: #f0f4f8;
        margin: 0;
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
      }
      .container {
        max-width: 700px;
        width: 100%;
        background: white;
        border-radius: 28px;
        padding: 30px 25px;
        box-shadow: 0 12px 30px rgba(0,0,0,0.1);
        text-align: center;
      }
      h1 {
        color: #1e2b3c;
      }
      marquee {
        font-size: 28px;
        color: #0077be;
        font-weight: bold;
        margin: 10px 0;
      }
      video {
        width: 100%;
        max-height: 400px;
        border-radius: 16px;
        margin: 15px 0;
        background: #000;
      }
      .btn-start {
        width: 100%;
        padding: 20px;
        font-size: 24px;
        background: #0077be;
        color: white;
        border: none;
        border-radius: 50px;
        cursor: pointer;
        font-weight: bold;
        transition: 0.3s;
        margin-top: 10px;
      }
      .btn-start:hover {
        background: #005f97;
        transform: scale(1.02);
      }
      footer {
        margin-top: 40px;
        width: 100%;
        background: #222;
        color: #fff;
        text-align: center;
        padding: 15px 0;
        font-size: 14px;
        border-radius: 20px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>📚 منصة تعليمية ❤️</h1>
      <marquee>🤍 ZeZo Jiilany ❤️</marquee>
      <video controls>
        <source src="https://cdn.imageurlgenerator.com/uploads/cf681e0c-3b66-40f2-ad1c-9c58bd6f6048.mp4" type="video/mp4">
        <track src="en.vtt" kind="subtitles" label="English">
        <track src="ar.vtt" kind="subtitles" label="Arabic">
      </video>
      <button class="btn-start" onclick="window.location.href='zeko.html';">🚀 اضغط للبدأ 🤍</button>
    </div>
    <footer>
      <p>جميع الحقوق محفوظة &copy; <span id="year"></span></p>
    </footer>
    <script>
      document.getElementById('year').textContent = new Date().getFullYear();
    </script>
  </body>
</html>
