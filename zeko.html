<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الأسئلة التفاعلية</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }
        body {
            background: #f4f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 20px;
        }
        .quiz-container {
            background: white;
            border-radius: 24px;
            padding: 30px 25px;
            max-width: 750px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #1e2b3c;
            font-size: 26px;
            margin-top: 0;
            border-bottom: 2px solid #0077be;
            padding-bottom: 12px;
        }
        .question {
            background: #eef6fc;
            padding: 16px 20px;
            border-radius: 16px;
            margin-bottom: 20px;
            border-right: 6px solid #0077be;
            transition: 0.2s;
        }
        .question h3 {
            margin: 0 0 12px 0;
            color: #003153;
            font-size: 18px;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .options label {
            background: white;
            padding: 10px 16px;
            border-radius: 30px;
            border: 1.5px solid #ccd9e6;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 16px;
            display: block;
        }
        .options label:hover:not(.disabled-label) {
            background: #d9e8f5;
            border-color: #0077be;
        }
        .options input[type="radio"] {
            margin-left: 12px;
            accent-color: #0077be;
            transform: scale(1.1);
            cursor: pointer;
        }
        .options input[type="radio"]:disabled {
            cursor: not-allowed;
        }
        .btn {
            background: #0077be;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: 0.3s;
            margin-top: 10px;
        }
        .btn:hover {
            background: #005f97;
            transform: scale(1.02);
        }
        .btn-green {
            background: #2b7a2b;
        }
        .btn-green:hover {
            background: #1e5e1e;
        }
        .result-box {
            margin-top: 25px;
            padding: 20px;
            background: #e7f3e7;
            border-radius: 20px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            color: #1f4f1f;
            border: 2px solid #2b7a2b;
            display: none;
        }
        .result-box.show {
            display: block;
        }
        .footer-note {
            margin-top: 20px;
            text-align: center;
            color: #7f8c8d;
            font-size: 14px;
        }
        .correct-answer {
            background: #c8e6c9 !important;
            border-color: #2e7d32 !important;
            font-weight: bold;
        }
        .wrong-answer {
            background: #ffcdd2 !important;
            border-color: #c62828 !important;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <h1>📝 منصة الأسئلة</h1>
    <div id="quizForm">
        <!-- الأسئلة ستظهر هنا -->
    </div>
    <button class="btn" id="checkBtn" onclick="checkAnswers()">✅ عرض النتيجة</button>
    <div class="result-box" id="resultBox">
        🎯 درجتك: <span id="scoreDisplay">0</span> / <span id="totalQuestions">20</span>
        <br><br>
        <button class="btn btn-green" onclick="resetQuiz()">🔄 اختبار جديد (أسئلة مختلفة)</button>
    </div>
    <div class="footer-note">جميع الحقوق محفوظة &copy; 2026</div>
</div>

<script>
    // =========================================================
    // 1. قاعدة الأسئلة (20 سؤالاً)
    // =========================================================
    const BASE_QUESTIONS = [
        { question: "ما هي عاصمة مصر؟", options: ["القاهرة", "الإسكندرية", "الجيزة", "أسوان"], answer: 0 },
        { question: "كم عدد الكواكب في المجموعة الشمسية؟", options: ["7", "8", "9", "10"], answer: 1 },
        { question: "ما هو أكبر محيط في العالم؟", options: ["الأطلسي", "الهادي", "الهندي", "المتجمد الشمالي"], answer: 1 },
        { question: "في أي عام انتهت الحرب العالمية الثانية؟", options: ["1943", "1944", "1945", "1946"], answer: 2 },
        { question: "ما هي اللغة الرسمية في البرازيل؟", options: ["الإسبانية", "البرتغالية", "الإنجليزية", "الفرنسية"], answer: 1 },
        { question: "من هو مؤسس شركة مايكروسوفت؟", options: ["ستيف جوبز", "بيل غيتس", "مارك زوكربيرج", "إيلون ماسك"], answer: 1 },
        { question: "ما هو أسرع حيوان بري؟", options: ["الأسد", "الغزال", "الفهد", "الحصان"], answer: 2 },
        { question: "كم عدد أيام السنة الكبيسة؟", options: ["365", "366", "364", "360"], answer: 1 },
        { question: "ما هي العملة الرسمية في بريطانيا؟", options: ["اليورو", "الدولار", "الجنيه الإسترليني", "الفرنك"], answer: 2 },
        { question: "أين يقع برج إيفل؟", options: ["لندن", "برلين", "باريس", "روما"], answer: 2 },
        { question: "ما هي عاصمة فرنسا؟", options: ["باريس", "لندن", "برلين", "مدريد"], answer: 0 },
        { question: "من هو مؤلف رواية 'مئة عام من العزلة'؟", options: ["غابرييل غارسيا ماركيز", "جابرييل غارسيا لوركا", "بابلو نيرودا", "ماريو بارغاس يوسا"], answer: 0 },
        { question: "ما هو العنصر الكيميائي الذي رمزه O؟", options: ["أكسجين", "هيدروجين", "كربون", "نيتروجين"], answer: 0 },
        { question: "كم تبلغ سرعة الضوء تقريباً (كم/ث)؟", options: ["300,000", "150,000", "500,000", "100,000"], answer: 0 },
        { question: "من هو أول خليفة إسلامي؟", options: ["أبو بكر الصديق", "عمر بن الخطاب", "عثمان بن عفان", "علي بن أبي طالب"], answer: 0 },
        { question: "ما هي أكبر قارة في العالم من حيث المساحة؟", options: ["آسيا", "أفريقيا", "أمريكا الشمالية", "أوروبا"], answer: 0 },
        { question: "ما هي اللغة الأكثر انتشاراً في العالم (كلغة أم)؟", options: ["الصينية", "الإنجليزية", "الإسبانية", "الهندية"], answer: 0 },
        { question: "في أي سنة هبط الإنسان على سطح القمر؟", options: ["1965", "1969", "1972", "1959"], answer: 1 },
        { question: "ما هو ناتج 5 × 7؟", options: ["30", "35", "40", "45"], answer: 1 },
        { question: "من هو مخترع المصباح الكهربائي المتوهج؟", options: ["توماس إديسون", "نيكولا تسلا", "ألكسندر غراهام بيل", "مايكل فاراداي"], answer: 0 }
    ];

    // =========================================================
    // 2. المتغيرات العامة والدوال المساعدة
    // =========================================================
    let currentQuestions = [];

    // دالة خلط عشوائي (خوارزمية فيشر-ييتس)
    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    // =========================================================
    // 3. عرض الأسئلة
    // =========================================================
    function renderQuestions(questionsArray) {
        const container = document.getElementById('quizForm');
        let html = '';
        for (let i = 0; i < questionsArray.length; i++) {
            const q = questionsArray[i];
            html += `<div class="question" data-qindex="${i}">
                        <h3>${i+1}. ${q.question}</h3>
                        <div class="options">`;
            for (let j = 0; j < q.options.length; j++) {
                html += `<label>
                            <input type="radio" name="q${i}" value="${j}">
                            ${q.options[j]}
                        </label>`;
            }
            html += `</div></div>`;
        }
        container.innerHTML = html;

        // تحديث العدد الكلي في صندوق النتيجة
        document.getElementById('totalQuestions').textContent = questionsArray.length;

        // إظهار زر التصحيح وإخفاء النتيجة القديمة (إن وجدت)
        document.getElementById('checkBtn').style.display = 'block';
        document.getElementById('resultBox').classList.remove('show');
    }

    // =========================================================
    // 4. بدء اختبار جديد (خلط الأسئلة + خلط الخيارات)
    // =========================================================
    function resetQuiz() {
        // 1. نسخ الأسئلة الأصلية وخلط ترتيبها
        let shuffledQuestions = shuffleArray([...BASE_QUESTIONS]);

        // 2. خلط الخيارات داخل كل سؤال مع الحفاظ على الإجابة الصحيحة
        shuffledQuestions = shuffledQuestions.map(q => {
            // نربط كل خيار بفهرسه الأصلي
            const optWithIdx = q.options.map((text, idx) => ({ text, idx }));
            shuffleArray(optWithIdx); // خلط عشوائي

            // بناء مصفوفة الخيارات الجديدة
            const newOptions = optWithIdx.map(item => item.text);
            // إيجاد الفهرس الجديد للإجابة الصحيحة
            const newAnswer = optWithIdx.findIndex(item => item.idx === q.answer);

            return {
                question: q.question,
                options: newOptions,
                answer: newAnswer
            };
        });

        currentQuestions = shuffledQuestions;
        renderQuestions(currentQuestions);

        // ده تمرير لاعلي الصفحة 
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // =========================================================
    // تصحيح الإجابات + تلوين الصح والغلط
    // =========================================================
    function checkAnswers() {
        const questionsDivs = document.querySelectorAll('.question');
        let score = 0;

        // 1. إعادة تعيين الألوان وتعطيل كل الخيارات
        questionsDivs.forEach(div => {
            const labels = div.querySelectorAll('.options label');
            const radios = div.querySelectorAll('.options input[type="radio"]');
            labels.forEach(label => {
                label.classList.remove('correct-answer', 'wrong-answer');
                label.style.background = '';
                label.style.borderColor = '';
            });
            radios.forEach(radio => radio.disabled = true);
        });

        // ده بيصحح كل سؤال
        for (let i = 0; i < currentQuestions.length; i++) {
            const div = questionsDivs[i];
            const labels = div.querySelectorAll('.options label');
            const radios = div.querySelectorAll('.options input[type="radio"]');
            const correctIndex = currentQuestions[i].answer;

            let selectedIndex = -1;
            radios.forEach((radio, idx) => {
                if (radio.checked) selectedIndex = idx;
            });

            // ده بيلون الاجابات الصحيحه
            labels.forEach((label, idx) => {
                // الإجابة الصحيحة دائماً باللون الأخضر
                if (idx === correctIndex) {
                    label.classList.add('correct-answer');
                }
                // ده ليحدد الإجابة الغلط اللي باللون الاحمر
                if (selectedIndex === idx && selectedIndex !== correctIndex) {
                    label.classList.add('wrong-answer');
                }
            });

            // ده بيحصل الدرجة
            if (selectedIndex === correctIndex) {
                score++;
            }
        }

        // 3. عرض النتيجة ده
        document.getElementById('scoreDisplay').textContent = score;
        const resultBox = document.getElementById('resultBox');
        resultBox.classList.add('show');

        // اخفاء الزر بتاع التصحيح
        document.getElementById('checkBtn').style.display = 'none';

        // تمرير سلس لصندوق النتيجة
        resultBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    // =========================================================
    // 6.تشغيل الصفحة ده
    // =========================================================
    window.onload = function() {
        resetQuiz();
    };
</script>
</body>
</html>
